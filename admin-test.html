<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجربة تبديل الفرق</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔄 تجربة تبديل الأشخاص</h1>

    <select id="person1">
      <option value="">اختاري الشخص الأول</option>
    </select>

    <select id="person2">
      <option value="">اختاري الشخص الثاني</option>
    </select>

    <button id="swapButton">تبديل 🔄</button>

    <div id="message"></div>
  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction
    } from
      "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAwCqQytfcnkzI8Sq-PoFFe0TXD0xJ4BpA",
      authDomain: "haya-shabab-teams.firebaseapp.com",
      databaseURL: "https://haya-shabab-teams-default-rtdb.firebaseio.com",
      projectId: "haya-shabab-teams",
      storageBucket: "haya-shabab-teams.firebasestorage.app",
      messagingSenderId: "472407340554",
      appId: "1:472407340554:web:3875a17b1b5594cc5ed1f3",
      measurementId: "G-B2XCEVNL5"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const person1 = document.getElementById("person1");
    const person2 = document.getElementById("person2");
    const swapButton = document.getElementById("swapButton");
    const message = document.getElementById("message");


    const teamNames = {
      blue: "Blue Team 🔵",
      red: "Red Team 🔴",
      green: "Green Team 🟢",
      purple: "Purple Team 🟣"
    };


    let currentState = null;


    function loadPeople(state) {

      currentState = state;

      person1.innerHTML =
        '<option value="">اختاري الشخص الأول</option>';

      person2.innerHTML =
        '<option value="">اختاري الشخص الثاني</option>';


      if (!state || !state.assignments) {
        return;
      }


      Object.entries(state.assignments).forEach(([clientId, assignment]) => {

        const name =
          typeof assignment === "string"
            ? "شخص"
            : assignment.name;

        const teamKey =
          typeof assignment === "string"
            ? assignment
            : assignment.team;

        const text =
          `${name} — ${teamNames[teamKey] || teamKey}`;


        const option1 = document.createElement("option");
        option1.value = clientId;
        option1.textContent = text;

        const option2 = document.createElement("option");
        option2.value = clientId;
        option2.textContent = text;


        person1.appendChild(option1);
        person2.appendChild(option2);

      });
    }


    onValue(ref(db, "teamState"), snapshot => {

      loadPeople(snapshot.val());

    });


    swapButton.addEventListener("click", async () => {

      const id1 = person1.value;
      const id2 = person2.value;


      if (!id1 || !id2) {
        message.textContent = "اختاري الشخصين الأول ❤️";
        return;
      }


      if (id1 === id2) {
        message.textContent = "مينفعش تختاري نفس الشخص مرتين 😅";
        return;
      }


      swapButton.disabled = true;
      message.textContent = "جاري التبديل...";


      try {

        const result = await runTransaction(
          ref(db, "teamState"),
          state => {

            if (!state || !state.assignments) {
              return state;
            }


            const a = state.assignments[id1];
            const b = state.assignments[id2];


            if (!a || !b) {
              return;
            }


            const team1 =
              typeof a === "string"
                ? a
                : a.team;

            const team2 =
              typeof b === "string"
                ? b
                : b.team;


            if (typeof a === "string") {
              state.assignments[id1] = {
                name: "شخص",
                team: team2
              };
            } else {
              state.assignments[id1].team = team2;
            }


            if (typeof b === "string") {
              state.assignments[id2] = {
                name: "شخص",
                team: team1
              };
            } else {
              state.assignments[id2].team = team1;
            }


            state.counts = {
              blue: 0,
              red: 0,
              green: 0,
              purple: 0
            };


            Object.values(state.assignments).forEach(assignment => {

              const team =
                typeof assignment === "string"
                  ? assignment
                  : assignment.team;

              if (state.counts[team] !== undefined) {
                state.counts[team]++;
              }

            });


            return state;
          }
        );


        if (result.committed) {
          message.textContent = "تم التبديل بنجاح ❤️🔄";
          person1.value = "";
          person2.value = "";
        } else {
          message.textContent = "التبديل لم يتم.";
        }

      } catch (error) {

        console.error(error);
        message.textContent =
          "حصل خطأ، ومفيش أي تغيير اتعمل ❤️";

      }


      swapButton.disabled = false;

    });

  </script>

</body>
</html>
