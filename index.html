<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هيا شباب هيا شباب</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #555;
    }

    button {
      margin-top: 25px;
      padding: 15px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #result {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
    }

    .blue { color: #1976d2; }
    .red { color: #d32f2f; }
    .green { color: #388e3c; }
    .purple { color: #7b1fa2; }
  </style>
</head>

<body>

  <div class="box">
    <h1>هيا شباب هيا شباب ✨</h1>

    <p>مستعد تعرف فريقك؟ ✨</p>

    <button id="startButton" onclick="joinTeam()">
      ابدأ
    </button>

    <div id="result"></div>
  </div>

  <script type="module">

    const startButton = document.getElementById("startButton");
    const result = document.getElementById("result");

    window.joinTeam = async function() {

      startButton.disabled = true;
      startButton.textContent = "جاري التوزيع...";

      result.textContent = "";

      try {

        result.textContent = "فريقك هو... ✨";

      } catch (error) {

        console.error(error);

        result.textContent = "حصل خطأ، حاول مرة تانية.";

        startButton.disabled = false;
        startButton.textContent = "ابدأ";
      }
    };

  </script>

</body>
</html>
