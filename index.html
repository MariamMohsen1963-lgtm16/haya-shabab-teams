<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هيا شباب هيا شباب</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #555;
    }

    input {
      width: 85%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: center;
      margin-top: 15px;
      box-sizing: border-box;
    }

    button {
      margin-top: 25px;
      padding: 15px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #result {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
    }

    .blue {
      color: #1976d2;
    }

    .red {
      color: #d32f2f;
    }

    .green {
      color: #388e3c;
    }

    .purple {
      color: #7b1fa2;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>هيا شباب هيا شباب ✨</h1>

    <p>اكتب اسمك واعرف فريقك ✨</p>

    <input
      type="text"
      id="nameInput"
      placeholder="اكتب اسمك هنا"
      maxlength="50"
    >

    <br>

    <button id="startButton">
      ابدأ
    </button>

    <div id="result"></div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAwCqQytfcnkzI8Sq-PoFFe0TXD0xJ4BpA",
      authDomain: "haya-shabab-teams.firebaseapp.com",
      databaseURL: "https://haya-shabab-teams-default-rtdb.firebaseio.com",
      projectId: "haya-shabab-teams",
      storageBucket: "haya-shabab-teams.firebasestorage.app",
      messagingSenderId: "472407340554",
      appId: "1:472407340554:web:3875a17b1b5594cc5ed1f3",
      measurementId: "G-B2XCEVNL5"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);


    const startButton =
      document.getElementById("startButton");

    const result =
      document.getElementById("result");

    const nameInput =
      document.getElementById("nameInput");


    const clientId =
      localStorage.getItem("hayaClientId") ||
      crypto.randomUUID();

    localStorage.setItem(
      "hayaClientId",
      clientId
    );


    const teams = [
      {
        key: "blue",
        name: "Blue Team 🔵",
        className: "blue"
      },
      {
        key: "red",
        name: "Red Team 🔴",
        className: "red"
      },
      {
        key: "green",
        name: "Green Team 🟢",
        className: "green"
      },
      {
        key: "purple",
        name: "Purple Team 🟣",
        className: "purple"
      }
    ];


    async function joinTeam() {

      const name =
        nameInput.value.trim();


      if (!name) {

        result.textContent =
          "اكتب اسمك الأول ❤️";

        result.className = "";

        return;
      }


      startButton.disabled = true;
      nameInput.disabled = true;

      startButton.textContent =
        "جاري التوزيع...";

      result.textContent = "";
      result.className = "";


      const stateRef =
        ref(db, "teamState");


      try {

        const tx =
          await runTransaction(
            stateRef,
            (state) => {

              state = state || {
                counts: {
                  blue: 0,
                  red: 0,
                  green: 0,
                  purple: 0
                },
                assignments: {}
              };


              state.counts =
                state.counts || {
                  blue: 0,
                  red: 0,
                  green: 0,
                  purple: 0
                };


              state.assignments =
                state.assignments || {};


              /*
               * لو الجهاز كان مستخدم في الاختبار القديم
               * وكان الفريق محفوظ كنص مثل "blue"
               * نحوله للصيغة الجديدة ونحفظ الاسم.
               */

              if (state.assignments[clientId]) {

                const oldAssignment =
                  state.assignments[clientId];


                if (
                  typeof oldAssignment === "string"
                ) {

                  state.assignments[clientId] = {
                    name: name,
                    team: oldAssignment
                  };

                } else {

                  /*
                   * لو البيانات بالفعل بالصورة الجديدة،
                   * نحدث الاسم فقط.
                   */

                  state.assignments[clientId].name =
                    name;
                }


                return state;
              }


              const available =
                teams.filter(
                  team =>
                    (state.counts[team.key] || 0) < 13
                );


              if (available.length === 0) {
                return;
              }


              const minCount =
                Math.min(
                  ...available.map(
                    team =>
                      state.counts[team.key] || 0
                  )
                );


              const chosen =
                available.find(
                  team =>
                    (state.counts[team.key] || 0)
                    === minCount
                );


              state.counts[chosen.key] =
                (state.counts[chosen.key] || 0) + 1;


              state.assignments[clientId] = {
                name: name,
                team: chosen.key
              };


              return state;

            }
          );


        if (!tx.committed) {

          result.textContent =
            "الفرق اكتملت الـ52 شخص 🎉";

          startButton.textContent =
            "اكتمل التوزيع";

          return;
        }


        const state =
          tx.snapshot.val();


        const assignment =
          state.assignments?.[clientId];


        if (!assignment) {
          throw new Error(
            "Assignment not found"
          );
        }


        /*
         * يدعم البيانات القديمة والجديدة.
         */

        const teamKey =
          typeof assignment === "string"
            ? assignment
            : assignment.team;


        const team =
          teams.find(
            team =>
              team.key === teamKey
          );


        if (!team) {
          throw new Error(
            "Team not found"
          );
        }


        result.textContent =
          `فريقك هو... ${team.name}`;


        result.className =
          team.className;


        startButton.textContent =
          "تم التوزيع ✨";


      } catch (error) {

        console.error(error);

        result.textContent =
          "حصل خطأ، حاول مرة تانية.";

        nameInput.disabled = false;

        startButton.disabled = false;

        startButton.textContent =
          "ابدأ";
      }

    }


    startButton.addEventListener(
      "click",
      joinTeam
    );

  </script>

</body>
</html>
