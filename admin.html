<!DOCTYPE html><html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>متابعة الفرق</title>  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .login {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .login input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .login button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .error {
      color: #d32f2f;
      text-align: center;
      margin-top: 10px;
    }

    .counts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .count {
      background: white;
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .blue {
      color: #1976d2;
    }

    .red {
      color: #d32f2f;
    }

    .green {
      color: #388e3c;
    }

    .purple {
      color: #7b1fa2;
    }

    .person {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .name {
      font-size: 18px;
      font-weight: bold;
    }

    .team {
      font-weight: bold;
    }

    #status {
      text-align: center;
      margin: 15px 0;
      color: #555;
    }

    #adminContent {
      display: none;
    }
  </style></head><body>  <div class="box"><div id="loginBox" class="login">

  <h1>🔐 دخول المسؤولين</h1>

  <input
    type="email"
    id="emailInput"
    placeholder="الإيميل"
  >

  <input
    type="password"
    id="passwordInput"
    placeholder="الباسورد"
  >

  <button id="loginButton">
    دخول
  </button>

  <div id="loginError" class="error"></div>

</div>


<div id="adminContent">

  <h1>📋 متابعة الفرق</h1>

  <div class="counts">

    <div class="count blue">
      🔵 Blue<br>
      <span id="blueCount">0</span> / 15
    </div>

    <div class="count red">
      🔴 Red<br>
      <span id="redCount">0</span> / 15
    </div>

    <div class="count green">
      🟢 Green<br>
      <span id="greenCount">0</span> / 15
    </div>

    <div class="count purple">
      🟣 Purple<br>
      <span id="purpleCount">0</span> / 15
    </div>

  </div>

  <div id="status">
    جاري تحميل الأسماء...
  </div>

  <div id="people"></div>

</div>

  </div>  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAwCqQytfcnkzI8Sq-PoFFe0TXD0xJ4BpA",
      authDomain: "haya-shabab-teams.firebaseapp.com",
      databaseURL: "https://haya-shabab-teams-default-rtdb.firebaseio.com",
      projectId: "haya-shabab-teams",
      storageBucket: "haya-shabab-teams.firebasestorage.app",
      messagingSenderId: "472407340554",
      appId: "1:472407340554:web:3875a17b1b5594cc5ed1f3",
      measurementId: "G-B2XCEVNL5"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const auth = getAuth(app);


    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const loginBox =
      document.getElementById("loginBox");

    const adminContent =
      document.getElementById("adminContent");


    const blueCount =
      document.getElementById("blueCount");

    const redCount =
      document.getElementById("redCount");

    const greenCount =
      document.getElementById("greenCount");

    const purpleCount =
      document.getElementById("purpleCount");

    const people =
      document.getElementById("people");

    const status =
      document.getElementById("status");


    const stateRef =
      ref(db, "teamState");


    loginButton.addEventListener("click", async () => {

      const email = emailInput.value.trim();

      const password = passwordInput.value;

      loginError.textContent = "";


      if (!email || !password) {

        loginError.textContent =
          "اكتبي الإيميل والباسورد.";

        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        loginError.textContent =
          "الإيميل أو الباسورد غير صحيح.";

      }

    });


    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginBox.style.display = "none";

        adminContent.style.display = "block";

        startAdmin();

      } else {

        loginBox.style.display = "block";

        adminContent.style.display = "none";

      }

    });


    function startAdmin() {

      onValue(stateRef, (snapshot) => {

        const state =
          snapshot.val();


        if (!state) {

          status.textContent =
            "لسه مفيش حد دخل.";

          people.innerHTML = "";

          return;
        }


        const counts =
          state.counts || {};

        const assignments =
          state.assignments || {};


        blueCount.textContent =
          counts.blue || 0;

        redCount.textContent =
          counts.red || 0;

        greenCount.textContent =
          counts.green || 0;

        purpleCount.textContent =
          counts.purple || 0;


        people.innerHTML = "";


        const teamNames = {
          blue: "🔵 Blue Team",
          red: "🔴 Red Team",
          green: "🟢 Green Team",
          purple: "🟣 Purple Team"
        };


        const teamClasses = {
          blue: "blue",
          red: "red",
          green: "green",
          purple: "purple"
        };


        const list =
          Object.values(assignments);


        if (list.length === 0) {

          status.textContent =
            "لسه مفيش حد دخل.";

          return;
        }


        status.textContent =
          `عدد المشاركين: ${list.length}`;


        list.forEach((assignment) => {

          let name;
          let teamKey;


          if (typeof assignment === "string") {

            name = "اسم غير مسجل";
            teamKey = assignment;

          } else {

            name =
              assignment.name || "بدون اسم";

            teamKey =
              assignment.team;
          }


          const person =
            document.createElement("div");

          person.className = "person";


          const nameElement =
            document.createElement("div");

          nameElement.className = "name";

          nameElement.textContent =
            name;


          const teamElement =
            document.createElement("div");

          teamElement.className =
            `team ${teamClasses[teamKey] || ""}`;

          teamElement.textContent =
            teamNames[teamKey] || "فريق غير معروف";


          person.appendChild(nameElement);

          person.appendChild(teamElement);

          people.appendChild(person);

        });

      });

    }

  </script></body></html>
